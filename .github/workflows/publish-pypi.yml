name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Immutable v-prefixed release tag to publish"
        required: true
        default: "v0.4.0"
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: release
        env:
          DISPATCH_REF: ${{ inputs.ref }}
          RELEASE_REF: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "release" ]]; then
            ref="$RELEASE_REF"
          else
            ref="$DISPATCH_REF"
          fi
          if [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Ref must be an immutable v-prefixed release tag" >&2
            exit 1
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and package version
        env:
          RELEASE_REF: ${{ steps.release.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_REF"
          test "$(git rev-list -n 1 "$RELEASE_REF")" = "$(git rev-parse HEAD)"
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          data = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected = f"v{data['project']['version']}"
          actual = os.environ["RELEASE_REF"]
          if actual != expected:
              raise SystemExit(f"Tag/version mismatch: {actual!r} != {expected!r}")
          if data["project"]["name"] != "nicolet-e2edf":
              raise SystemExit("Unexpected distribution name")
          PY
          test -z "$(git status --porcelain)"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build distributions from the tagged source
        run: uv build --no-sources

      - name: Check package metadata and rendering
        run: uvx twine check dist/*

      - name: Clean-install and exercise the wheel
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.11 .venv-artifact
          uv pip install --python .venv-artifact/bin/python dist/*.whl
          .venv-artifact/bin/python - <<'PY'
          import importlib.metadata
          import pathlib
          import tomllib

          expected = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          actual = importlib.metadata.version("nicolet-e2edf")
          if actual != expected:
              raise SystemExit(f"Installed version mismatch: {actual!r} != {expected!r}")
          PY
          .venv-artifact/bin/nicolet-e2edf --help >/dev/null

      - name: Upload validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nicolet-e2edf/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI using trusted identity
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
